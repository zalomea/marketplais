name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IDENTITY_REGISTRY_ADDRESS: "0x8004A169FB4a3325136EB29fA0ceB6D2e539a432"
  REPUTATION_REGISTRY_ADDRESS: "0x8004baa17c55a88189ae136b182e5fda19de9b63"

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable
      
      - name: Run hardhat node and deploy contracts
        run: |
          yarn chain > /tmp/chain.log 2>&1 &
          CHAIN_PID=$!
          
          echo "Waiting for Hardhat node to be ready..."
          for i in {1..30}; do
            if nc -z localhost 8545; then
              echo "Hardhat node is ready!"
              break
            fi
            sleep 1
          done

          yarn deploy
          kill $CHAIN_PID || true

      - name: Run hardhat lint
        run: yarn hardhat:lint --max-warnings=0

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types